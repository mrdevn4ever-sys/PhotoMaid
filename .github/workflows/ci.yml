name: CI

# Nur manuell starten (Nutzervorgabe 2026-10-09: GitHub-Actions-Minuten NUR auf ausdrückliche Anweisung).
# Kein push-/pull_request-/schedule-Auslöser – ein Push oder PR verbraucht keine Minuten.
on:
  workflow_dispatch:
    inputs:
      duo_probe:
        description: "Nur Xcode-/SDK-/iPhone-Duo-Simulator-Verfügbarkeit prüfen"
        type: boolean
        default: false
      store_locales:
        description: "App-Store-Aufnahmen statt QA: all oder Kommaliste (leer = normale CI)"
        type: string
        default: ""
      ui_tests:
        description: "UI-Tests und Screenshots ausführen (länger)"
        type: boolean
        default: false
      native_capture:
        description: "Nur die native iOS-Screenshot-Aufnahme untersuchen (kein App-Build)"
        type: boolean
        default: false
      qa_case:
        description: "QA-Oberflächen: alle, Tresor, nur Medienlöschung oder Fotoeditor bei Zoom"
        type: choice
        options: [all, vault, vault-media, editor]
        default: all
      sim_runtime:
        description: "iOS-Runtime (26.2 für StoreKit Test; 26.5 hat Apples CLI-Konfigurationsfehler)"
        type: choice
        options: [latest, "26.2"]
        default: "26.2"
      ui_phase:
        description: "UI-Durchlauf (gezielte Wiederholung nach der ersten Gesamtprüfung)"
        type: choice
        options: [all, fixtures, real, start, store-screenshots, store-previews, store-export]
        default: all
      ui_case:
        description: "PhotoKit-Fachtest (all = vollständige Prüfung; Pro prüft auch die Tresor-Voraussetzung)"
        type: choice
        options:
          - all
          - test10AnalysisQueueProgressAndGrid
          - test20FiftyFastSwipesAdAndDirections
          - test30GestureHelpAndCustomControls
          - test50LargeDuplicatesAndStorage
          - test60LibraryFiltersSortAndAspect
          - test70StudioFreeTools
          - test80VaultPINCloseAllTabsAndFreeFolder
          - test90ProStoreKitPurchaseNoAdsAndFolder
          - test95EnglishAndArabicPlaceholdersAndArrows
          - test98TrashLimitRewardAndSizes
        default: all
      baseline_run:
        description: "Quell-Lauf-ID für store-export oder ältere xcresult-Screenshots"
        type: string
        default: ""
      collect_run:
        description: "Nur vorhandene UI-Belege aufteilen (Lauf-ID; keine App-Tests)"
        type: string
        default: ""
      collect_artifact:
        description: "Vorhandenes Belegartefakt für collect_run"
        type: string
        default: simulator-ui-evidence

concurrency:
  # Keep evidence from the previous commit while validating a fix on the same branch.
  group: ci-${{ github.ref }}-${{ github.sha }}-${{ inputs.store_locales }}-${{ inputs.native_capture && 'native' || inputs.collect_run || inputs.ui_phase || 'all' }}-${{ inputs.ui_case || 'all' }}-${{ inputs.sim_runtime || 'latest' }}-${{ inputs.qa_case || 'all' }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  duo-environment:
    if: inputs.duo_probe
    name: iPhone Duo – Xcode und Simulator prüfen
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Duo-Werkzeuge untersuchen
        run: scripts/ci/duo_environment.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: duo-environment
          path: duo-environment/
  app-store:
    if: inputs.store_locales != '' && inputs.ui_phase != 'store-export'
    uses: ./.github/workflows/app-store-assets.yml
    with:
      locales: ${{ inputs.store_locales }}
      capture: ${{ inputs.ui_phase == 'store-screenshots' && 'screenshots' || inputs.ui_phase == 'store-previews' && 'previews' || 'all' }}
  app-store-export:
    if: inputs.store_locales != '' && inputs.ui_phase == 'store-export'
    uses: ./.github/workflows/app-store-export.yml
    with:
      locales: ${{ inputs.store_locales }}
      source_run: ${{ inputs.baseline_run }}
  native-screenshot:
    if: inputs.native_capture
    uses: ./.github/workflows/simulator-screenshot.yml
    with:
      sim_runtime: ${{ inputs.sim_runtime }}
  core:
    if: inputs.collect_run == '' && !inputs.native_capture && !inputs.duo_probe && inputs.store_locales == ''
    name: PhotoMaidCore (Linux, swift test)
    runs-on: ubuntu-24.04
    container: swift:6.4-noble
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - name: swift test
        shell: bash
        run: |
          set -o pipefail
          swift test 2>&1 | tee core-test.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-test-log
          path: core-test.log

  ios:
    if: inputs.collect_run == '' && !inputs.native_capture && !inputs.duo_probe && inputs.store_locales == ''
    name: iOS App (xcodebuild build + test)
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Xcode wählen (neuestes stabiles)
        run: scripts/ci/select_xcode.sh
      - name: XcodeGen
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Texte prüfen (alle Kennungen in 16 Sprachen)
        run: python3 scripts/android_strings_to_xcstrings.py --check
      - name: Simulator wählen
        id: sim
        env:
          PM_SIM_RUNTIME: ${{ inputs.sim_runtime != 'latest' && inputs.sim_runtime || '' }}
        run: |
          udid=$(scripts/ci/pick_simulator.sh)
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$udid" 2>/dev/null || true
          xcrun simctl bootstatus "$udid" -b
      - name: Build und Unit-Tests
        id: build
        run: |
          set -o pipefail
          # Alle Compilerfehler in einem Lauf sammeln, statt nach dem ersten Batch abzubrechen.
          defaults write com.apple.dt.Xcode IDEBuildingContinueBuildingAfterErrors -bool YES
          xcodebuild -project PhotoMaid.xcodeproj -scheme PhotoMaid \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath "$RUNNER_TEMP/PhotoMaidDerived" \
            -resultBundlePath "$RUNNER_TEMP/tests.xcresult" \
            -parallel-testing-enabled NO \
            -skipPackagePluginValidation -skipMacroValidation \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=YES -skip-testing:PhotoMaidUITests \
            build-for-testing test-without-building 2>&1 | tee xcodebuild.log | grep -E "error:|\*\* (BUILD|TEST)|Test (Case|Suite) .* (passed|failed)|Executed" || true
          grep -Eq '\*\* TEST( EXECUTE)? SUCCEEDED \*\*' xcodebuild.log
          ! grep -Eq '\*\* (BUILD|TEST( BUILD| EXECUTE)?) FAILED \*\*' xcodebuild.log
      - name: UI-Tests vorbereiten (öffentliche Testbilder)
        id: media
        if: inputs.ui_tests
        run: |
          python3 -m venv "$RUNNER_TEMP/media-venv"
          "$RUNNER_TEMP/media-venv/bin/pip" install Pillow==12.3.0
          echo "$RUNNER_TEMP/media-venv/bin" >> "$GITHUB_PATH"
          brew install ffmpeg
      - name: UI-Tests mit QA-Daten
        if: inputs.ui_tests && inputs.ui_phase != 'real' && inputs.ui_phase != 'start'
        continue-on-error: true
        env:
          PM_QA_CASE: ${{ inputs.qa_case }}
        run: bash scripts/ci/simulator_ui_tests.sh '${{ steps.sim.outputs.udid }}' "$RUNNER_TEMP/PhotoMaidDerived" "$RUNNER_TEMP/simulator-ui" fixtures
      - name: QA-Belege sofort bereitstellen
        uses: actions/upload-artifact@v4
        if: always() && inputs.ui_tests && inputs.ui_phase != 'real' && inputs.ui_phase != 'start'
        with:
          name: simulator-fixtures-evidence
          path: ${{ runner.temp }}/simulator-ui/fixtures*
          if-no-files-found: warn
      - name: PhotoKit-Starttest (Einführung, Einwilligung, vier Kaltstarts)
        if: always() && inputs.ui_tests && inputs.ui_phase != 'fixtures' && steps.build.outcome == 'success' && steps.media.outcome == 'success'
        continue-on-error: true
        env:
          PM_UI_CASE: ${{ inputs.ui_phase == 'start' && 'start' || inputs.ui_case }}
        run: bash scripts/ci/simulator_ui_tests.sh '${{ steps.sim.outputs.udid }}' "$RUNNER_TEMP/PhotoMaidDerived" "$RUNNER_TEMP/simulator-ui" real-start
      - name: PhotoKit-Startbelege sofort bereitstellen
        uses: actions/upload-artifact@v4
        if: always() && inputs.ui_tests && inputs.ui_phase != 'fixtures'
        with:
          name: simulator-real-start-evidence
          path: ${{ runner.temp }}/simulator-ui/real-start*
          if-no-files-found: warn
      - name: Analyse-Warteschlange
        if: always() && inputs.ui_tests && inputs.ui_phase != 'fixtures' && inputs.ui_phase != 'start' && steps.build.outcome == 'success' && steps.media.outcome == 'success' && (inputs.ui_case == 'all' || inputs.ui_case == 'test10AnalysisQueueProgressAndGrid')
        continue-on-error: true
        uses: ./.github/actions/simulator-case
        with:
          udid: ${{ steps.sim.outputs.udid }}
          test_case: test10AnalysisQueueProgressAndGrid
      - name: Feed, Werbekarte und Verlauf
        if: always() && inputs.ui_tests && inputs.ui_phase != 'fixtures' && inputs.ui_phase != 'start' && steps.build.outcome == 'success' && steps.media.outcome == 'success' && (inputs.ui_case == 'all' || inputs.ui_case == 'test20FiftyFastSwipesAdAndDirections')
        continue-on-error: true
        uses: ./.github/actions/simulator-case
        with:
          udid: ${{ steps.sim.outputs.udid }}
          test_case: test20FiftyFastSwipesAdAndDirections
      - name: Wischhilfe und eigene Tasten
        if: always() && inputs.ui_tests && inputs.ui_phase != 'fixtures' && inputs.ui_phase != 'start' && steps.build.outcome == 'success' && steps.media.outcome == 'success' && (inputs.ui_case == 'all' || inputs.ui_case == 'test30GestureHelpAndCustomControls')
        continue-on-error: true
        uses: ./.github/actions/simulator-case
        with:
          udid: ${{ steps.sim.outputs.udid }}
          test_case: test30GestureHelpAndCustomControls
      - name: Große Dateien, Duplikate, Speicher
        if: always() && inputs.ui_tests && inputs.ui_phase != 'fixtures' && inputs.ui_phase != 'start' && steps.build.outcome == 'success' && steps.media.outcome == 'success' && (inputs.ui_case == 'all' || inputs.ui_case == 'test50LargeDuplicatesAndStorage')
        continue-on-error: true
        uses: ./.github/actions/simulator-case
        with:
          udid: ${{ steps.sim.outputs.udid }}
          test_case: test50LargeDuplicatesAndStorage
      - name: "Fotos: Filter und Ansicht"
        if: always() && inputs.ui_tests && inputs.ui_phase != 'fixtures' && inputs.ui_phase != 'start' && steps.build.outcome == 'success' && steps.media.outcome == 'success' && (inputs.ui_case == 'all' || inputs.ui_case == 'test60LibraryFiltersSortAndAspect')
        continue-on-error: true
        uses: ./.github/actions/simulator-case
        with:
          udid: ${{ steps.sim.outputs.udid }}
          test_case: test60LibraryFiltersSortAndAspect
      - name: Studio ohne Pro
        if: always() && inputs.ui_tests && inputs.ui_phase != 'fixtures' && inputs.ui_phase != 'start' && steps.build.outcome == 'success' && steps.media.outcome == 'success' && (inputs.ui_case == 'all' || inputs.ui_case == 'test70StudioFreeTools')
        continue-on-error: true
        uses: ./.github/actions/simulator-case
        with:
          udid: ${{ steps.sim.outputs.udid }}
          test_case: test70StudioFreeTools
      - name: Tresor mit PIN und Gratis-Ordner
        if: always() && inputs.ui_tests && inputs.ui_phase != 'fixtures' && inputs.ui_phase != 'start' && steps.build.outcome == 'success' && steps.media.outcome == 'success' && (inputs.ui_case == 'all' || inputs.ui_case == 'test80VaultPINCloseAllTabsAndFreeFolder' || inputs.ui_case == 'test90ProStoreKitPurchaseNoAdsAndFolder')
        continue-on-error: true
        uses: ./.github/actions/simulator-case
        with:
          udid: ${{ steps.sim.outputs.udid }}
          test_case: test80VaultPINCloseAllTabsAndFreeFolder
      - name: StoreKit-Kauf und Pro ohne Werbung
        if: always() && inputs.ui_tests && inputs.ui_phase != 'fixtures' && inputs.ui_phase != 'start' && steps.build.outcome == 'success' && steps.media.outcome == 'success' && (inputs.ui_case == 'all' || inputs.ui_case == 'test90ProStoreKitPurchaseNoAdsAndFolder')
        continue-on-error: true
        uses: ./.github/actions/simulator-case
        with:
          udid: ${{ steps.sim.outputs.udid }}
          test_case: test90ProStoreKitPurchaseNoAdsAndFolder
      - name: Englisch und Arabisch
        if: always() && inputs.ui_tests && inputs.ui_phase != 'fixtures' && inputs.ui_phase != 'start' && steps.build.outcome == 'success' && steps.media.outcome == 'success' && (inputs.ui_case == 'all' || inputs.ui_case == 'test95EnglishAndArabicPlaceholdersAndArrows')
        continue-on-error: true
        uses: ./.github/actions/simulator-case
        with:
          udid: ${{ steps.sim.outputs.udid }}
          test_case: test95EnglishAndArabicPlaceholdersAndArrows
      - name: Papierkorb und Tagesbonus ohne Löschung
        if: always() && inputs.ui_tests && inputs.ui_phase != 'fixtures' && inputs.ui_phase != 'start' && steps.build.outcome == 'success' && steps.media.outcome == 'success' && (inputs.ui_case == 'all' || inputs.ui_case == 'test98TrashLimitRewardAndSizes')
        continue-on-error: true
        uses: ./.github/actions/simulator-case
        with:
          udid: ${{ steps.sim.outputs.udid }}
          test_case: test98TrashLimitRewardAndSizes
      - name: UI-Ergebnisse prüfen
        env:
          UI_CASE: ${{ inputs.ui_case }}
        if: always() && inputs.ui_tests && steps.build.outcome == 'success'
        run: |
          if [ '${{ inputs.ui_phase }}' != real ] && [ '${{ inputs.ui_phase }}' != start ]; then
            test "$(cat "$RUNNER_TEMP/simulator-ui/fixtures.exit")" = 0
          fi
          if [ '${{ inputs.ui_phase }}' != fixtures ]; then
            test "$(cat "$RUNNER_TEMP/simulator-ui/real-start.exit")" = 0
            if [ '${{ inputs.ui_phase }}' != start ]; then
              for method in test10AnalysisQueueProgressAndGrid test20FiftyFastSwipesAdAndDirections test30GestureHelpAndCustomControls test50LargeDuplicatesAndStorage test60LibraryFiltersSortAndAspect test70StudioFreeTools test80VaultPINCloseAllTabsAndFreeFolder test90ProStoreKitPurchaseNoAdsAndFolder test95EnglishAndArabicPlaceholdersAndArrows test98TrashLimitRewardAndSizes; do
                if [ "$UI_CASE" != all ] && [ "$UI_CASE" != "$method" ]; then
                  if [ "$UI_CASE" != test90ProStoreKitPurchaseNoAdsAndFolder ] || [ "$method" != test80VaultPINCloseAllTabsAndFreeFolder ]; then
                    continue
                  fi
                fi
                test "$(cat "$RUNNER_TEMP/simulator-ui/real-$method.exit")" = 0
              done
            fi
          fi
      - name: Ältere Simulator-Belege exportieren
        if: always() && inputs.baseline_run != ''
        env:
          GH_TOKEN: ${{ github.token }}
          BASELINE_RUN: ${{ inputs.baseline_run }}
        run: |
          [[ "$BASELINE_RUN" =~ ^[0-9]+$ ]]
          baseline="$RUNNER_TEMP/simulator-ui/baseline-$BASELINE_RUN"
          gh run download "$BASELINE_RUN" --repo "$GITHUB_REPOSITORY" -n ios-build-report -D "$baseline"
          if [ -f "$baseline/tests.xcresult.zip" ]; then
            unzip -q "$baseline/tests.xcresult.zip" -d "$baseline"
            xcrun xcresulttool export attachments --path "$baseline/tests.xcresult" --output-path "$baseline/attachments" || true
            xcrun xcresulttool get test-results summary --path "$baseline/tests.xcresult" > "$baseline/summary.json" || true
            rm -rf "$baseline/tests.xcresult"
          fi
      - name: Bericht für den nächsten Korrekturdurchlauf
        if: always()
        run: |
          python3 scripts/ci/ci_report.py xcodebuild.log > ci-report.md || true
          cat ci-report.md >> "$GITHUB_STEP_SUMMARY"
      - name: xcresult packen
        if: always()
        run: |
          [ -d "$RUNNER_TEMP/tests.xcresult" ] && ditto -c -k --keepParent "$RUNNER_TEMP/tests.xcresult" tests.xcresult.zip || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-build-report
          path: |
            xcodebuild.log
            ci-report.md
            tests.xcresult.zip
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always() && inputs.ui_tests
        with:
          name: simulator-ui-evidence
          path: ${{ runner.temp }}/simulator-ui
          if-no-files-found: warn

  evidence:
    name: Vorhandene Simulatorbelege aufteilen
    if: inputs.collect_run != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Lauf-ID prüfen
        env:
          COLLECT_RUN: ${{ inputs.collect_run }}
        run: '[[ "$COLLECT_RUN" =~ ^[0-9]+$ ]]'
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.collect_run }}
          name: ${{ inputs.collect_artifact }}
          path: evidence-source
      - run: python3 scripts/ci/collect_ui_evidence.py evidence-source evidence-review
      - uses: actions/upload-artifact@v4
        with:
          name: ui-review-logs
          path: evidence-review/logs
      - uses: actions/upload-artifact@v4
        with:
          name: ui-review-images-1
          path: evidence-review/images-1
      - uses: actions/upload-artifact@v4
        with:
          name: ui-review-images-2
          path: evidence-review/images-2
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: ui-review-images-3
          path: evidence-review/images-3
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: ui-review-images-4
          path: evidence-review/images-4
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: ui-review-xcresult-1
          path: evidence-review/xcresult-parts/*.part001
      - uses: actions/upload-artifact@v4
        with:
          name: ui-review-xcresult-2
          path: evidence-review/xcresult-parts/*.part002
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: ui-review-xcresult-3
          path: evidence-review/xcresult-parts/*.part003
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: ui-review-xcresult-4
          path: evidence-review/xcresult-parts/*.part004
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: ui-review-xcresult-5
          path: evidence-review/xcresult-parts/*.part005
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: ui-review-xcresult-6
          path: evidence-review/xcresult-parts/*.part006
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: ui-review-xcresult-7
          path: evidence-review/xcresult-parts/*.part007
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: ui-review-xcresult-8
          path: evidence-review/xcresult-parts/*.part008
          if-no-files-found: ignore
