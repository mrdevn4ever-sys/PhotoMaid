name: Nativen Simulator-Screenshot prüfen

on:
  workflow_dispatch:
    inputs:
      sim_runtime:
        type: choice
        options: [latest, "26.2"]
        default: latest
  workflow_call:
    inputs:
      sim_runtime:
        type: string
        default: latest

permissions:
  contents: read

jobs:
  capture:
    if: github.ref == 'refs/heads/claude/fixes-analysis-library-vault-20261014'
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: scripts/ci/select_xcode.sh
      - name: Öffentliche Simulator-Funktion „Trigger Screenshot“ prüfen
        shell: bash
        env:
          PM_SIM_RUNTIME: ${{ inputs.sim_runtime != 'latest' && inputs.sim_runtime || '' }}
        run: |
          mkdir -p evidence
          udid=$(scripts/ci/pick_simulator.sh)
          echo "$udid" > evidence/simulator.txt
          xcrun simctl boot "$udid" 2>/dev/null || true
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl list devices booted --json > evidence/booted-devices.json
          bash scripts/ci/native_screenshot.sh "$udid" evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-screenshot-evidence
          path: evidence
