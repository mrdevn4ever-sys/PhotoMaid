name: Nativen Simulator-Screenshot prüfen

on:
  workflow_dispatch:
    inputs:
      sim_runtime:
        type: choice
        options: [latest, "26.2"]
        default: latest
  workflow_call:
    inputs:
      sim_runtime:
        type: string
        default: latest

permissions:
  contents: read

jobs:
  capture:
    if: github.ref == 'refs/heads/claude/fixes-analysis-library-vault-20261014'
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: scripts/ci/select_xcode.sh
      - name: Öffentliche Simulator-Funktion „Trigger Screenshot“ prüfen
        shell: bash
        env:
          PM_SIM_RUNTIME: ${{ inputs.sim_runtime != 'latest' && inputs.sim_runtime || '' }}
        run: |
          mkdir -p evidence
          udid=$(scripts/ci/pick_simulator.sh)
          echo "$udid" > evidence/simulator.txt
          xcrun simctl boot "$udid" 2>/dev/null || true
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl list devices booted --json > evidence/booted-devices.json
          xcrun simctl launch "$udid" com.apple.mobileslideshow
          sleep 5
          xcrun simctl io "$udid" screenshot evidence/before.png
          # Existing Simulator processes ignore new launch arguments. Select this exact device afresh.
          osascript -e 'tell application "Simulator" to quit'
          simulator_app="$(xcode-select -p)/Applications/Simulator.app"
          open -a "$simulator_app" --args -CurrentDeviceUDID "$udid"
          set +e
          osascript > evidence/menu.log 2>&1 <<'APPLESCRIPT'
          with timeout of 20 seconds
            tell application "Simulator" to activate
            delay 2
            tell application "System Events"
              tell process "Simulator"
                set frontmost to true
                log (name of every window)
                if not enabled of menu item "Trigger Screenshot" of menu "Device" of menu bar 1 then error "Screenshot menu is disabled"
                click menu item "Trigger Screenshot" of menu "Device" of menu bar 1
                delay 8
              end tell
            end tell
          end timeout
          APPLESCRIPT
          status=$?
          set -e
          echo "$status" > evidence/menu.exit
          xcrun simctl io "$udid" screenshot evidence/after.png
          sleep 8
          xcrun simctl io "$udid" screenshot evidence/after-settled.png
          find "$HOME/Library/Developer/CoreSimulator/Devices/$udid/data/Media/DCIM" -type f \
            > evidence/camera-roll-files.txt 2>/dev/null || true
          cat evidence/menu.log
          test "$status" = 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-screenshot-evidence
          path: evidence
