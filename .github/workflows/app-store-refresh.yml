# Branch-scoped capture iteration. No release, App Store Connect, PR or automatic trigger.
name: GaleriQ – Concept A en-US native capture v4
on:
  workflow_dispatch:
    inputs:
      locales:
        description: 'This iteration accepts en only; no other languages are produced.'
        type: string
        default: en
      devices:
        description: 'This iteration accepts iphone-medium only (native 1206 x 2622).'
        type: string
        default: iphone-medium
permissions:
  contents: read
concurrency:
  group: galeriq-concept-a-en-${{ github.ref }}
  cancel-in-progress: false
jobs:
  capture:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/hermes/store-concept-a-en'
    name: Fresh 1.0.1 app, genuine library and English evidence
    runs-on: macos-26
    timeout-minutes: 65
    env:
      CAPTURE_LOCALE: en
      CAPTURE_MODE: concept-a-v4
      STORE_DEVICE: iphone-medium
      CONCEPT_BASE_SHA: 583eb804a81401aa2010996875b35d05afc61539
      REQUESTED_LOCALES: ${{ inputs.locales }}
      REQUESTED_DEVICES: ${{ inputs.devices }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 30
          sparse-checkout: |
            .github
            PhotoMaid
            PhotoMaidTests
            PhotoMaidUITests
            Sources
            Tests
            scripts
            app-store/media
            app-store/concepts/A/qa
            app-store/concepts/A/v4-source-media
      - name: Guard the exact branch, baseline and en-US-only scope
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/hermes/store-concept-a-en
          test "$REQUESTED_LOCALES" = en
          test "$REQUESTED_DEVICES" = iphone-medium
          git merge-base --is-ancestor "$CONCEPT_BASE_SHA" HEAD
          mkdir -p "$RUNNER_TEMP/store-capture"
          git rev-parse HEAD > "$RUNNER_TEMP/store-capture/source-commit.txt"
          git status --porcelain > "$RUNNER_TEMP/store-capture/checkout-status.txt"
          test ! -s "$RUNNER_TEMP/store-capture/checkout-status.txt"
      - name: Select the existing native toolchain
        run: |
          set -euo pipefail
          scripts/ci/select_xcode.sh
          command -v xcodegen >/dev/null || brew install xcodegen
          command -v ffmpeg >/dev/null || brew install ffmpeg
          python3 -m venv "$RUNNER_TEMP/store-python"
          "$RUNNER_TEMP/store-python/bin/pip" -q install pillow
          xcodebuild -version > "$RUNNER_TEMP/store-capture/xcode.txt"
          xcrun simctl list runtimes -j > "$RUNNER_TEMP/store-capture/available-runtimes.json"
      - name: Build current app and capture test without Apple credentials
        run: |
          set -euo pipefail
          python3 scripts/android_strings_to_xcstrings.py --check
          mkdir -p "$RUNNER_TEMP/concept-a-wire"
          cp scripts/store/verify_concept_a_wire.swift "$RUNNER_TEMP/concept-a-wire/main.swift"
          swiftc Sources/PhotoMaidCore/Organize/PhotoSeries.swift "$RUNNER_TEMP/concept-a-wire/main.swift" \
            -o "$RUNNER_TEMP/concept-a-wire/verify-json-wire"
          "$RUNNER_TEMP/concept-a-wire/verify-json-wire" > "$RUNNER_TEMP/store-capture/json-wire-unit.txt"
          xcodegen generate
          if ! xcodebuild -project PhotoMaid.xcodeproj -scheme PhotoMaid \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/store-build" \
            -enableCodeCoverage NO CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=YES \
            -skipPackagePluginValidation -skipMacroValidation build-for-testing \
            > "$RUNNER_TEMP/store-capture/build.log" 2>&1; then
            python3 -c 'from pathlib import Path;import os;print("\n".join((Path(os.environ["RUNNER_TEMP"])/"store-capture/build.log").read_text(errors="replace").splitlines()[-120:]))'
            exit 1
          fi
      - name: Generate hash-verified CC0 clutter, identical photos, series and actual large videos
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/store-python/bin/python" scripts/store/build_concept_a_v4_fixture.py \
            --sources app-store/concepts/A/v4-source-media \
            --allowlist app-store/concepts/A/qa/v4-fixture-source-allowlist.json --output "$RUNNER_TEMP/concept-a-fixture"
          cp "$RUNNER_TEMP/concept-a-fixture/fixture-manifest.json" "$RUNNER_TEMP/store-capture/fixture-manifest.json"
      - name: Create and clean only a new disposable real iPhone simulator
        id: sim
        timeout-minutes: 12
        run: |
          set -euo pipefail
          python3 scripts/store/create_capture_simulator.py "$STORE_DEVICE" "$RUNNER_TEMP/store-capture/device.json"
          udid=$(python3 -c 'import json,os;print(json.load(open(os.environ["RUNNER_TEMP"]+"/store-capture/device.json"))["udid"])')
          printf 'udid=%s\n' "$udid" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl shutdown "$udid"
          python3 scripts/store/empty_simulator_photos.py "$udid"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl ui "$udid" appearance dark
          xcrun simctl status_bar "$udid" override --time '9:41' --dataNetwork wifi --wifiMode active --wifiBars 3 --batteryState charged --batteryLevel 100
          UDID="$udid" "$RUNNER_TEMP/store-python/bin/python" - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'concept-a-fixture'
          manifest=json.loads((root/'fixture-manifest.json').read_text())
          assert manifest['status']=='PASS' and manifest['images']==35 and manifest['videos']==2
          for row in manifest['records']:
              subprocess.run(['xcrun','simctl','addmedia',os.environ['UDID'],str(root/row['file'])],check=True)
          PY
          xcrun simctl install "$udid" "$RUNNER_TEMP/store-build/Build/Products/Debug-iphonesimulator/PhotoMaid.app"
          xcrun simctl privacy "$udid" grant photos com.mrdevn4ever.photomaid
      - name: Capture real swipes, finished results, trash confirmation, vault and creative tools
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: bash scripts/store/capture.sh "$UDID" "$RUNNER_TEMP/store-build" "$RUNNER_TEMP/store-capture"
      - name: Bind actual sources, test result and native logo to this exact run and SHA
        if: always()
        run: |
          "$RUNNER_TEMP/store-python/bin/python" scripts/store/collect_concept_a_v4_provenance.py "$RUNNER_TEMP/store-capture" \
            --sources app-store/concepts/A/v4-source-media \
            --allowlist app-store/concepts/A/qa/v4-fixture-source-allowlist.json \
            --fixture-root "$RUNNER_TEMP/concept-a-fixture"
      - name: Preserve native evidence even on failure; no production media replacement
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: galeriq-concept-a-v4-en-US-native-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/store-capture/screenshots
            ${{ runner.temp }}/store-capture/branding
            ${{ runner.temp }}/store-capture/stills
            ${{ runner.temp }}/store-capture/control/*.json
            ${{ runner.temp }}/store-capture/navigation/*.json
            ${{ runner.temp }}/store-capture/*.json
            ${{ runner.temp }}/store-capture/*.png
            ${{ runner.temp }}/store-capture/*.log
            ${{ runner.temp }}/store-capture/*.txt
            ${{ runner.temp }}/store-capture/diagnostics
          if-no-files-found: warn
          retention-days: 7
      - name: Delete only this task's disposable simulator
        if: always() && steps.sim.outputs.udid != ''
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          xcrun simctl shutdown "$UDID" || true
          xcrun simctl delete "$UDID"
