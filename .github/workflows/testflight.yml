name: TestFlight

# Nur manuell starten – und nur auf ausdrückliche Anweisung (GitHub-Actions-Minuten, Apple-Upload).
# Signierung ausschließlich aus GitHub-Secrets; nichts davon liegt im Repository (docs/CI_TESTFLIGHT.md).
on:
  workflow_dispatch:
    inputs:
      changelog:
        description: "Was testen? (erscheint in TestFlight unter „Was ist zu testen“)"
        type: string
        default: "Interner Testbuild"
      run_tests:
        description: "Vor dem Upload Unit-Tests ausführen"
        type: boolean
        default: true
      confirm_upload:
        description: "Sicherheitsbestätigung: exakt UPLOAD eingeben"
        type: string
        required: true
        default: ""

concurrency:
  group: testflight
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  beta:
    name: Archivieren, signieren, hochladen
    runs-on: macos-26
    timeout-minutes: 90
    environment: testflight   # Environment; confirm_upload ist eine zusätzliche manuelle Bedienungssicherung
    env:
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
      APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
      PM_TEAM_ID: ${{ vars.PM_TEAM_ID || 'HUN9MS832X' }}
      PM_BUNDLE_ID: ${{ vars.PM_BUNDLE_ID || 'com.mrdevn4ever.photomaid' }}
      PM_PRO_PRODUCT_ID: ${{ vars.PM_PRO_PRODUCT_ID || 'com.mrdevn4ever.photomaid.pro' }}
      PM_PRIVACY_POLICY_URL: ${{ vars.PM_PRIVACY_POLICY_URL || 'https://mrdevn4ever-sys.github.io/photomaid-website/' }}
      # Werbung (E19): echte AdMob-IDs als Secrets oder Variablen; ohne sie Googles Test-Anzeigen.
      PM_ADMOB_APP_ID: ${{ secrets.PM_ADMOB_APP_ID || vars.PM_ADMOB_APP_ID }}
      PM_ADMOB_APP_OPEN_ID: ${{ secrets.PM_ADMOB_APP_OPEN_ID || vars.PM_ADMOB_APP_OPEN_ID }}
      PM_ADMOB_NATIVE_ID: ${{ secrets.PM_ADMOB_NATIVE_ID || vars.PM_ADMOB_NATIVE_ID }}
      PM_ADMOB_REWARDED_ID: ${{ secrets.PM_ADMOB_REWARDED_ID || vars.PM_ADMOB_REWARDED_ID }}
      CHANGELOG: ${{ inputs.changelog }}
      RUN_TESTS: ${{ inputs.run_tests }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Same app/test inputs as CI; Store captures are not part of the signed app.
          sparse-checkout: |
            .github
            PhotoMaid
            PhotoMaidTests
            PhotoMaidUITests
            Sources
            Tests
            scripts
            fastlane
      - name: Upload-Bestätigung prüfen
        env:
          CONFIRM_UPLOAD: ${{ inputs.confirm_upload }}
        run: |
          set -euo pipefail
          if [ "$CONFIRM_UPLOAD" != "UPLOAD" ]; then
            echo "::error::Upload blockiert: confirm_upload muss exakt UPLOAD sein."
            exit 1
          fi
      - name: Privacy-Manifeste vorprüfen
        run: |
          python3 -m unittest discover -s scripts/ci -p 'test_check_privacy_manifests.py' -v
          python3 scripts/ci/check_privacy_manifests.py PhotoMaid/Resources/PrivacyInfo.xcprivacy
      - name: Pflicht-Secrets vorhanden?
        run: |
          missing=""
          for v in APP_STORE_CONNECT_KEY_ID APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_API_KEY_BASE64 APPLE_CERTIFICATE_PASSWORD APPLE_CERTIFICATE_BASE64 APPLE_PROVISIONING_PROFILE_BASE64 PM_TEAM_ID PM_BUNDLE_ID PM_PRIVACY_POLICY_URL; do
            [ -z "${!v}" ] && missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::Fehlende Secrets/Variablen:$missing (siehe docs/CI_TESTFLIGHT.md)"; exit 1
          fi
      - name: Xcode wählen
        run: scripts/ci/select_xcode.sh
      - name: Werkzeuge
        run: |
          brew install xcodegen
          gem install fastlane --no-document
          xcodegen generate
      - name: Manuelles Signing prüfen
        run: |
          set -euo pipefail
          umask 077
          p12="$RUNNER_TEMP/dist.p12"
          profile="$RUNNER_TEMP/profile.mobileprovision"
          p8="$RUNNER_TEMP/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          printf '%s' "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$p12"
          printf '%s' "$APPLE_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$profile"
          printf '%s' "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 --decode > "$p8"
          openssl pkey -in "$p8" -noout -check >/dev/null 2>&1
          security cms -D -i "$profile" > "$RUNNER_TEMP/profile.plist"
          python3 - "$RUNNER_TEMP/profile.plist" "$p12" <<'PY'
          import hashlib
          import plistlib
          import subprocess
          import sys

          profile_path, p12_path = sys.argv[1:]
          with open(profile_path, "rb") as f:
              profile = plistlib.load(f)
          team = "HUN9MS832X"
          bundle = "com.mrdevn4ever.photomaid"
          entitlements = profile.get("Entitlements", {})
          assert profile.get("TeamIdentifier") == [team]
          assert entitlements.get("application-identifier") == f"{team}.{bundle}"
          assert entitlements.get("get-task-allow") is False
          assert "ProvisionedDevices" not in profile
          p12_pem = subprocess.check_output([
              "openssl", "pkcs12", "-in", p12_path, "-clcerts", "-nokeys",
              "-passin", "env:APPLE_CERTIFICATE_PASSWORD"
          ], stderr=subprocess.DEVNULL)
          p12_der = subprocess.check_output(["openssl", "x509", "-outform", "DER"], input=p12_pem)
          expected = hashlib.sha256(p12_der).hexdigest()
          embedded = [hashlib.sha256(cert).hexdigest() for cert in profile.get("DeveloperCertificates", [])]
          assert expected in embedded
          print("Signing preflight: PASS")
          PY
      - name: Unit-Tests
        if: env.RUN_TESTS == 'true'
        run: |
          set -o pipefail
          UDID=$(scripts/ci/pick_simulator.sh)
          xcodebuild -project PhotoMaid.xcodeproj -scheme PhotoMaid -destination "id=$UDID" \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=YES \
            -parallel-testing-enabled NO -skip-testing:PhotoMaidUITests \
            -skipPackagePluginValidation -skipMacroValidation test 2>&1 | tee unit-tests.log | grep -E "error:|\*\* TEST" || true
          grep -Eq '\*\* TEST( EXECUTE)? SUCCEEDED \*\*' unit-tests.log
          ! grep -Eq '\*\* (BUILD|TEST( BUILD| EXECUTE)?) FAILED \*\*' unit-tests.log
      - name: fastlane beta
        run: fastlane ios beta
      - name: Bericht
        if: always()
        run: |
          LOG=$(ls -t ~/Library/Logs/gym/*.log 2>/dev/null | head -1 || true)
          [ -n "$LOG" ] && cp "$LOG" gym.log
          python3 scripts/ci/ci_report.py gym.log > ci-report.md || true
          cat ci-report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: testflight-report
          path: |
            gym.log
            unit-tests.log
            ci-report.md
            fastlane/report.xml
            build/privacy-manifests.json
          if-no-files-found: warn
      - name: Schlüsselbund und Schlüssel entfernen
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/photomaid-ci.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP"/AuthKey_*.p8 "$RUNNER_TEMP"/dist.p12 "$RUNNER_TEMP"/dist-legacy.p12 "$RUNNER_TEMP"/dist-key.pem "$RUNNER_TEMP"/profile.mobileprovision
