name: Store-Texte hochladen

# Nur manuell: lädt Name, Untertitel, Keywords, Werbetext, Beschreibung und URLs aus app-store/metadata
# (16 Sprachen) in die bearbeitbare App-Store-Version. Kein Build, keine Bilder, keine Einreichung, kein Release.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "App-Store-Version in App Store Connect (muss bearbeitbar sein)"
        type: string
        default: "1.0"
      confirm_upload:
        description: "Sicherheitsbestätigung: exakt TEXTE eingeben"
        type: string
        required: true
        default: ""

concurrency:
  group: store-metadata
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  metadata:
    name: Store-Texte nach App Store Connect
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: testflight
    env:
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
      PM_BUNDLE_ID: ${{ vars.PM_BUNDLE_ID || 'com.mrdevn4ever.photomaid' }}
      PM_TEAM_ID: ${{ vars.PM_TEAM_ID || 'HUN9MS832X' }}
      PM_STORE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            app-store/metadata
            scripts/store
            fastlane
      - name: Bestätigung prüfen
        env:
          CONFIRM_UPLOAD: ${{ inputs.confirm_upload }}
        run: |
          if [ "$CONFIRM_UPLOAD" != "TEXTE" ]; then
            echo "::error::Abgebrochen: confirm_upload muss exakt TEXTE sein."; exit 1
          fi
          for v in APP_STORE_CONNECT_KEY_ID APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_API_KEY_BASE64; do
            [ -n "${!v}" ] || { echo "::error::Secret $v fehlt"; exit 1; }
          done
      - name: Texte prüfen
        run: python3 scripts/store/metadata_texts.py --check
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - name: fastlane
        run: gem install fastlane --no-document
      - name: Hochladen
        run: fastlane ios store_metadata
