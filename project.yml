# XcodeGen-Spezifikation. `xcodegen generate` erzeugt PhotoMaid.xcodeproj (nicht eingecheckt; CI erzeugt es).
# Bundle-ID, Team und Kauf-Produkt kommen in CI aus GitHub-Secrets/-Variablen (docs/CI_TESTFLIGHT.md).
name: PhotoMaid
options:
  bundleIdPrefix: app.photomaid
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_EMIT_LOC_STRINGS: NO          # Texte kommen aus scripts/android_strings_to_xcstrings.py
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    STRING_CATALOG_GENERATE_SYMBOLS: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "2"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: "HUN9MS832X"
packages:
  PhotoMaidCore:
    path: .
targets:
  PhotoMaid:
    type: application
    platform: iOS
    sources:
      - path: PhotoMaid
        excludes:
          - "**/*.md"
          - "**/*.storekit"   # nur Scheme-Konfiguration, nicht ins App-Bundle
          - "Resources/ios_strings.json"
    dependencies:
      - package: PhotoMaidCore
      - sdk: StoreKit.framework
      - sdk: Photos.framework
      - sdk: PhotosUI.framework
      - sdk: AVFoundation.framework
      - sdk: AVKit.framework
      - sdk: CoreImage.framework
      - sdk: PDFKit.framework
      - sdk: Vision.framework
      - sdk: VisionKit.framework
      - sdk: PencilKit.framework
      - sdk: QuickLook.framework
      - sdk: MediaPlayer.framework
      - sdk: MetricKit.framework
      - sdk: UserNotifications.framework
    info:
      path: PhotoMaid/App/Info.plist
      properties:
        CFBundleDisplayName: PhotoMaid
        CFBundleDevelopmentRegion: en
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleAllowMixedLocalizations: false
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSPhotoLibraryUsageDescription: "PhotoMaid shows your photos and videos for sorting on this iPhone and only removes items you choose and confirm in the system dialog."
        NSPhotoLibraryAddUsageDescription: "PhotoMaid saves edited copies, collages, videos and PDFs as new items in your library."
        NSCameraUsageDescription: "PhotoMaid uses the camera only to scan documents when you tap Scan."
        NSFaceIDUsageDescription: "PhotoMaid uses Face ID only to unlock your private vault on this iPhone."
        NSMicrophoneUsageDescription: "PhotoMaid uses the microphone only when you record a voice memo in your private vault."
        PHPhotoLibraryPreventAutomaticLimitedAccessAlert: true
        UIFileSharingEnabled: false
        LSSupportsOpeningDocumentsInPlace: false
        ITSAppUsesNonExemptEncryption: false
        BGTaskSchedulerPermittedIdentifiers:
          - $(PRODUCT_BUNDLE_IDENTIFIER).export.*
        CFBundleDocumentTypes:
          - CFBundleTypeName: Images and Videos
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.image, public.movie]
          - CFBundleTypeName: PDF
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.adobe.pdf]
        PMProProductID: $(PM_PRO_PRODUCT_ID)
        PMPrivacyPolicyURL: $(PM_PRIVACY_POLICY_URL)
    entitlements:
      path: PhotoMaid/App/PhotoMaid.entitlements
      properties: {}   # bewusst leer: kein CloudKit, kein iCloud, keine App Groups (E9)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mrdevn4ever.photomaid
        TARGETED_DEVICE_FAMILY: "1"   # Keep XcodeGen's app-target default from adding iPad.
        PM_PROVISIONING_PROFILE: ""
        PROVISIONING_PROFILE_SPECIFIER: $(PM_PROVISIONING_PROFILE)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        PM_PRO_PRODUCT_ID: ""
        PM_PRIVACY_POLICY_URL: ""
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG QA_FIXTURES
          PM_PRO_PRODUCT_ID: test.photomaid.pro.lifetime   # nur lokaler StoreKit-Test (PhotoMaid.storekit)
  PhotoMaidTests:
    type: bundle.unit-test
    platform: iOS
    sources: [PhotoMaidTests]
    dependencies:
      - target: PhotoMaid
      - package: PhotoMaidCore
  PhotoMaidUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [PhotoMaidUITests]
    dependencies:
      - target: PhotoMaid
schemes:
  PhotoMaid:
    build:
      targets:
        PhotoMaid: all
    run:
      config: Debug
      storeKitConfiguration: PhotoMaid/Resources/PhotoMaid.storekit
    test:
      config: Debug
      gatherCoverageData: true
      language: de
      region: DE
      targets:
        - PhotoMaidTests
        - PhotoMaidUITests
    profile:
      config: Release
    archive:
      config: Release
