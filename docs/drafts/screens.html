<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PhotoMaid Screen-Entwürfe</title>
<style>
:root{
  --bg:#EEF5FD;--bg2:#DCEAFB;--surface:rgba(255,255,255,.78);--stroke:rgba(255,255,255,.9);
  --t1:#0F2747;--t2:#4A6282;--blue:#007AFF;--red:#FF3B30;--teal:#30B0C7;--orange:#FF9500;--green:#34C759;--indigo:#5856D6;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#c9d8ea;font-family:-apple-system,"SF Pro Text","Inter","Helvetica Neue",Arial,sans-serif;color:var(--t1);padding:24px;display:flex;flex-wrap:wrap;gap:28px;justify-content:center}
.wrap{display:flex;flex-direction:column;align-items:center;gap:10px}
.cap{font-size:15px;font-weight:600;color:#0F2747}
.cap small{display:block;font-weight:500;font-size:11px;letter-spacing:.12em;color:#4A6282;text-align:center}
.phone{width:390px;height:844px;border-radius:54px;overflow:hidden;position:relative;background:linear-gradient(180deg,var(--bg),var(--bg2));box-shadow:0 0 0 10px #1c2230,0 0 0 11px #3a4254,0 30px 60px rgba(15,39,71,.35)}
.draft{position:absolute;left:0;right:0;bottom:0;height:22px;display:flex;align-items:center;justify-content:center;background:rgba(255,149,0,.92);color:#fff;font-size:10px;font-weight:700;letter-spacing:.08em;z-index:50}
.status{height:50px;display:flex;justify-content:space-between;align-items:center;padding:14px 32px 0;font-weight:600;font-size:15px}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:122px;height:35px;background:#000;border-radius:20px}
.content{position:absolute;top:50px;left:0;right:0;bottom:0;padding:0 18px;overflow:hidden}
.glass{background:rgba(255,255,255,.55);backdrop-filter:blur(18px) saturate(1.6);-webkit-backdrop-filter:blur(18px) saturate(1.6);border:1px solid rgba(255,255,255,.85);box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 6px 18px rgba(15,39,71,.10)}
.circle{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:600;color:var(--t1);flex:none}
.card{background:var(--surface);border:1px solid var(--stroke);border-radius:22px;padding:14px 16px}
.row{display:flex;align-items:center;gap:12px;min-height:48px}
.ico{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:18px;flex:none}
.t{font-weight:600;font-size:16px}
.s{font-size:12px;color:var(--t2)}
.v{margin-left:auto;text-align:right;font-size:14px;font-weight:600}
.chev{color:var(--t2);font-size:14px;margin-left:6px}
.divider{height:1px;background:rgba(74,98,130,.15);margin:2px 0 2px 52px}
.h1{font-size:34px;font-weight:700;letter-spacing:-.02em}
.sub{font-size:15px;color:var(--t2)}
.hdr{display:flex;align-items:flex-start;justify-content:space-between;padding-top:10px}
.center{text-align:center}
.tb{display:flex;align-items:flex-start;justify-content:space-between;padding-top:6px}
.tb .mid{text-align:center;flex:1}
.tb .ttl{font-weight:600;font-size:17px}
.tabbar{position:absolute;left:14px;right:14px;bottom:24px;height:64px;border-radius:32px;display:flex;justify-content:space-around;align-items:center;padding:0 6px}
.tab{display:flex;flex-direction:column;align-items:center;font-size:10px;color:var(--t2);gap:3px;width:80px;padding:6px 0;border-radius:24px}
.tab b{font-size:20px;font-weight:500}
.tab.on{color:var(--blue);background:rgba(0,122,255,.12)}
.btn{border-radius:999px;padding:14px 18px;text-align:center;font-weight:600;font-size:16px}
.btnp{background:linear-gradient(180deg,#2d8cff,#0a6cf0);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 8px 20px rgba(0,122,255,.35)}
.seg{display:flex;background:rgba(118,128,150,.14);border-radius:10px;padding:2px;font-size:13px;font-weight:500}
.seg div{flex:1;text-align:center;padding:6px 0;border-radius:8px}
.seg .on{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.list-h{font-size:13px;color:var(--t2);text-transform:uppercase;letter-spacing:.03em;margin:16px 4px 6px}
.foot{font-size:12px;color:var(--t2);margin:6px 4px 0;line-height:1.35}
.thumb{width:52px;height:52px;border-radius:10px;flex:none}
.bar{height:8px;border-radius:4px;background:rgba(118,128,150,.2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--blue);border-radius:4px}
.pill{display:inline-block;white-space:nowrap;border-radius:999px;padding:8px 14px;font-size:14px;font-weight:600}
.tog{width:51px;height:31px;border-radius:16px;background:var(--green);position:relative;flex:none}
.tog:after{content:"";position:absolute;right:2px;top:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2)}
.tog.off{background:rgba(118,128,150,.3)}.tog.off:after{right:auto;left:2px}
.ex{font-size:10px;color:var(--orange);font-weight:700;letter-spacing:.04em}
/* Platzhalterbilder (keine Stockfotos) */
.img1{background:linear-gradient(160deg,#f6d5a8 0%,#e9a66b 35%,#5f93c9 70%,#2c5e8f 100%)}
.img2{background:linear-gradient(200deg,#bfe3f7,#6aa9d8 45%,#355f7d)}
.img3{background:linear-gradient(170deg,#ffe3b3,#f3a683 40%,#8e6fa8 80%)}
.img4{background:linear-gradient(140deg,#d7f0d9,#8cc59a 50%,#3d7a58)}
.img5{background:linear-gradient(180deg,#e7eef7,#aebfd6)}
.img6{background:linear-gradient(130deg,#fbe7c6,#e4b77c 50%,#9d6b3d)}
</style>
</head>
<body>
<script>
const DRAFT='<div class="draft">ENTWURF – KEINE APP-AUFNAHME</div>';
const STATUS='<div class="island"></div><div class="status"><span>9:41</span><span>●●● ▲ ▮</span></div>';
function tabbar(on){const t=[["⌂","Heute"],["≋","Aufräumen"],["▭","Ordnen"],["◷","Verlauf"]];
 return '<div class="tabbar glass">'+t.map((x,i)=>`<div class="tab ${i===on?'on':''}"><b>${x[0]}</b>${x[1]}</div>`).join('')+'</div>'}
function toolbar(title,sub,left='‹',right='⋯'){return `<div class="tb"><div class="circle glass">${left}</div><div class="mid"><div class="ttl">${title}</div>${sub?`<div class="s">${sub}</div>`:''}</div><div class="circle glass">${right}</div></div>`}
function row(icon,color,title,sub,val,det,chev=true){return `<div class="row"><div class="ico" style="background:${color}1f;color:${color}">${icon}</div><div><div class="t">${title}</div>${sub?`<div class="s">${sub}</div>`:''}</div><div class="v">${val||''}${det?`<div class="s" style="font-weight:400">${det}</div>`:''}</div>${chev?'<span class="chev">›</span>':''}</div>`}
function phone(n,title,sub,html){document.body.insertAdjacentHTML('beforeend',`<div class="wrap" id="s${n}"><div class="phone">${DRAFT}${STATUS}<div class="content">${html}</div></div><div class="cap">${n}. ${title}<small>${sub}</small></div></div>`)}

/* 1 Heute */
phone(1,'Heute','TodayView',`
<div class="hdr"><div><div class="h1">PhotoMaid</div><div class="sub">Eine aufgeräumte Galerie für das,<br>was zählt</div></div><div class="circle glass">⚙︎</div></div>
<div class="card" style="margin-top:14px"><div style="display:flex;align-items:baseline;gap:8px"><span style="font-size:28px;font-weight:700">63,4 GB</span><span class="sub">von 128 GB belegt</span></div><div class="bar" style="margin:10px 0 6px"><i style="width:49%"></i></div><div class="s">Systemwert des iPhones, nicht nur Fotos</div></div>
<div class="card" style="margin-top:12px"><div class="row"><div class="ico img1" style="width:52px;height:52px"></div><div><div style="font-size:22px;font-weight:600">1.642 Elemente</div><div style="font-size:15px">warten auf eine Entscheidung</div><div class="s">Mach Platz und behalte, was du liebst.</div></div><span class="chev" style="color:var(--blue);margin-left:auto">›</span></div></div>
<div class="card" style="margin-top:12px;padding:10px 16px"><div class="t" style="font-size:15px">⏰ 3 zurückgestellte Elemente sind wieder fällig</div></div>
<div class="card" style="margin-top:12px;padding:6px 16px">
${row('▣','#007AFF','Fotos','', '1.342','Elemente')}<div class="divider"></div>
${row('▶','#007AFF','Videos','', '318','Elemente')}<div class="divider"></div>
${row('⌗','#007AFF','Screenshots','', '520','Elemente')}<div class="divider"></div>
${row('↓','#007AFF','Downloads','Verbundene Quellen')}<div class="divider"></div>
${row('❐','#5856D6','Duplikate','Exakt identische Kopien')}
</div>
<div class="ex" style="margin-top:8px">Beispieldaten</div>
${tabbar(0)}`);

/* 2 Feed Foto */
function feed(title,pos,img,video){return `
${toolbar(title,pos,'✕','⋯')}
<div style="position:relative;margin-top:10px;height:486px;border-radius:28px;overflow:hidden" class="${img}">
 ${video?`<div class="circle glass" style="position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);width:64px;height:64px;font-size:24px">▶</div>
 <div class="glass" style="position:absolute;left:10px;right:10px;bottom:10px;border-radius:30px;display:flex;align-items:center;gap:10px;padding:6px 8px 6px 14px"><span style="font-size:12px;font-weight:600">0:32</span><div class="bar" style="flex:1;height:4px"><i style="width:35%"></i></div><div class="circle glass" style="width:36px;height:36px;font-size:13px">🔇</div></div>`
 :`<div class="glass" style="position:absolute;left:14px;bottom:14px;border-radius:12px;padding:6px 12px"><div style="font-weight:600;font-size:14px">14. Juli 2024</div><div class="s" style="color:var(--t1)">4032 × 3024</div></div>`}
</div>
<div style="height:84px;margin-top:10px"></div>
<div style="display:flex;gap:8px;margin-top:8px">${[['↓','#4A6282'],['←','#FF3B30'],['↑','#007AFF'],['→','#30B0C7'],['↺','#4A6282']].map(b=>`<div class="glass" style="flex:1;height:44px;border-radius:22px;display:flex;align-items:center;justify-content:center;color:${b[1]};font-weight:700;font-size:18px">${b[0]}</div>`).join('')}</div>
<div class="glass" style="margin-top:10px;border-radius:26px;height:48px;display:flex;align-items:center;padding:0 16px;gap:10px;font-size:14px;font-weight:500"><span style="color:var(--red)">🗑</span>Auswahlkorb: 8 Elemente<span class="chev" style="margin-left:auto">›</span></div>`}
phone(2,'Feed – Foto','ReviewFeedView · MediaPage',feed('Fotos prüfen','3 von 18','img1',false)+`
<div style="position:absolute;inset:0;background:rgba(0,0,0,.18)"></div>
<div style="position:absolute;left:18px;right:18px;top:170px;display:flex;flex-direction:column;align-items:center;gap:16px">
 ${[['↑','Wisch nach oben','Behalten + weiter','#007AFF']].map(h=>hint(h)).join('')}
 <div style="display:flex;gap:16px">${hint(['←','Wisch nach links','Vormerken','#FF3B30'])}${hint(['→','Wisch nach rechts','Später','#30B0C7'])}</div>
 ${hint(['↓','Wisch nach unten','Vorheriges','#4A6282'])}
 <div class="btn btnp" style="padding:12px 30px">Verstanden</div>
</div>`);
function hint(h){return `<div class="glass" style="border-radius:22px;padding:10px 14px;min-width:130px;text-align:center"><div style="font-size:22px;font-weight:700;color:${h[3]}">${h[0]}</div><div style="font-size:11px">${h[1]}</div><div style="font-size:14px;font-weight:600;color:${h[3]}">${h[2]}</div></div>`}

/* 3 Feed Video mit Terminleiste */
phone(3,'Feed – Video','Terminleiste nach „rechts“',feed('Videos prüfen','5 von 12','img3',true).replace('<div style="height:84px;margin-top:10px"></div>',`
<div style="height:84px;margin-top:10px" class="card"><div style="font-size:12px;font-weight:600">Zurückgestellt. Wann wieder zeigen?</div><div style="display:flex;gap:6px;margin-top:8px">${['Morgen','7 Tage','30 Tage','…','✕'].map(x=>`<span class="pill glass" style="padding:7px 12px">${x}</span>`).join('')}</div></div>`));

/* 4 Datenschutz */
phone(4,'Datenschutz & Zugriff','PrivacyAccessView',`
<div class="center" style="padding-top:18px"><div class="glass" style="display:inline-flex;width:92px;height:92px;border-radius:22px;align-items:center;justify-content:center;font-size:44px;color:var(--blue)">⛨</div>
<div style="font-size:24px;font-weight:700;margin-top:12px">Deine Privatsphäre zuerst</div>
<div class="s" style="font-size:13px;margin-top:8px;line-height:1.4">PhotoMaid analysiert deine Fotos, Videos und freigegebenen Dateien auf diesem iPhone. Es gibt keinen PhotoMaid-Server und kein Konto. Wenn du iCloud-Fotos nutzt, synchronisiert Apple deine Mediathek – auch Löschungen können dann andere Geräte betreffen.</div></div>
<div class="card" style="margin-top:14px"><div style="display:flex;justify-content:space-between"><span class="t">▣ Fotos & Videos</span><span style="font-size:12px;font-weight:600;color:var(--orange)">Ausgewählte Fotos</span></div><div class="s" style="margin:4px 0 10px">Zum Anzeigen, Sortieren und – nur nach deiner Bestätigung – Entfernen ausgewählter Medien.</div><span class="pill glass">Auswahl verwalten</span></div>
<div class="card" style="margin-top:10px"><div style="display:flex;justify-content:space-between"><span class="t">🔔 Mitteilungen</span><span class="s" style="font-weight:600">Nicht angefragt</span></div><div class="s" style="margin:4px 0 10px">Optional: Erinnerungen an fällige Wiedervorlagen. Ohne Dateinamen auf dem Sperrbildschirm.</div><span class="pill glass">Mitteilungen erlauben</span></div>
<div class="card" style="margin-top:10px"><div class="t">▭ Ordner (optional)</div><div class="s">Dateien siehst du nur aus Ordnern, die du selbst auswählst.</div></div>
<div class="btn btnp" style="margin-top:16px">Weiter</div>`);

/* 5 Auswahlkorb */
phone(5,'Auswahlkorb','CleanupBasketView',`
${toolbar('Auswahlkorb','','‹',' ')}
<div style="margin-top:10px"><div style="font-size:22px;font-weight:600">6 Elemente vorgemerkt</div><div class="s">Prüfe die Auswahl, bevor etwas entfernt wird. Abgewählte Elemente bleiben erhalten.</div><div class="s" style="font-weight:600;margin-top:4px">Heute noch 12 von 15 Bereinigungen frei</div></div>
<div class="list-h">Fotos & Videos</div>
<div class="card" style="padding:4px 12px">${[['img1','Foto','14. Juli 2024'],['img2','Video','3. Juni 2024'],['img5','Screenshot','18. Mai 2024'],['img6','Foto','22. Apr. 2024']].map(r=>`<div class="row"><span style="color:var(--red);font-size:20px">◉</span><div class="thumb ${r[0]}"></div><div><div class="t" style="font-size:15px">${r[1]}</div><div class="s">${r[2]}</div></div></div>`).join('<div class="divider"></div>')}</div>
<div class="foot">Wird über die Fotos-App entfernt. iOS fragt dich zur Bestätigung. Die Medien landen in „Zuletzt gelöscht“. Mit iCloud-Fotos gilt das für alle deine Geräte.</div>
<div class="list-h">Dateien</div>
<div class="card" style="padding:4px 12px"><div class="row"><span style="color:var(--red);font-size:20px">◉</span><div class="thumb" style="background:#ffe1de;display:flex;align-items:center;justify-content:center;color:var(--red);font-weight:700">PDF</div><div><div class="t" style="font-size:15px">Vacation_Plan.pdf</div></div></div></div>
<div class="foot">Dateien werden endgültig gelöscht. Kein Papierkorb, kein Rückgängig.</div>
<div style="position:absolute;left:18px;right:18px;bottom:34px"><div class="btn btnp">4 Fotos/Videos prüfen und entfernen</div><div class="btn glass" style="margin-top:8px;color:var(--red)">1 Datei endgültig löschen</div></div>
<div class="ex" style="position:absolute;top:8px;left:18px">Beispieldaten</div>`);

/* 6 Aufräumen */
phone(6,'Aufräumen','CleanUpHubView',`
<div class="hdr"><div><div class="h1">Aufräumen</div><div class="sub">Finde und entferne, was du nicht<br>brauchst – auf deinem Gerät.</div></div><div class="circle glass">⚙︎</div></div>
<div class="seg" style="margin:12px 0"><div class="on">Alle</div><div>Medien</div><div>Dateien</div></div>
${[['▣','Fotos','Ähnliches prüfst du selbst im Feed','1.342'],['▶','Videos','Große und unnötige Videos','318'],['⌗','Screenshots','Schnappschüsse aufräumen','520'],['↓','Downloads','Dateien aus verbundenen Ordnern'],['▤','Große Dateien','Bekannte Größe ab einem Filterwert'],['❐','Duplikate','Exakte Kopien (Hash-bestätigt)'],['▥','Speicherübersicht','Was PhotoMaid sehen kann']].map(r=>`<div class="card" style="padding:4px 14px;margin-bottom:8px">${row(r[0],'#007AFF',r[1],r[2],r[3]||'',r[3]?'Elemente':'')}</div>`).join('')}
${tabbar(1)}`);

/* 7 Downloads */
phone(7,'Downloads','FileBrowserView',`
${toolbar('Downloads','','‹','＋')}
<div class="glass" style="margin-top:10px;border-radius:14px;padding:10px 14px;color:var(--t2);font-size:15px">⌕ Dateien durchsuchen …</div>
<div class="card" style="margin-top:10px;padding:10px 14px;display:flex;justify-content:space-between"><span>Dateityp</span><span style="color:var(--blue)">Alle ⌄</span></div>
${[['Heute',[['PDF','#FF3B30','Travel-Itinerary.pdf','2,4 MB · 14.07.2024'],['ZIP','#8E8E93','Beach Photos.zip','1,2 GB · 12.07.2024']]],['Letzte 30 Tage',[['PDF','#FF3B30','Hotel-Booking.pdf','1,8 MB · 28.06.2024'],['ZIP','#8E8E93','Maps-Offline.zip','456 MB · 21.06.2024']]],['Älter',[['DOC','#007AFF','Presentation-Final.pptx','12 MB · 03.03.2024'],['?','#8E8E93','Software-Setup.pkg','Größe unbekannt']]]].map(g=>`<div class="list-h">${g[0]}</div><div class="card" style="padding:4px 12px">${g[1].map(f=>`<div class="row"><div class="ico" style="background:${f[1]}1f;color:${f[1]};font-size:11px;font-weight:700">${f[0]}</div><div><div class="t" style="font-size:15px">${f[2]}</div><div class="s">${f[3]}</div></div></div>`).join('<div class="divider"></div>')}</div>`).join('')}
<div class="ex" style="margin-top:8px">Beispieldaten · nur verbundene Ordner</div>`);

/* 8 Große Dateien */
phone(8,'Große Dateien','LargeFilesView',`
${toolbar('Große Dateien','','‹',' ')}
<div class="card" style="margin-top:10px"><div style="display:flex;align-items:baseline;gap:8px"><span style="font-size:28px;font-weight:700">mind. 6,8 GB</span><span class="sub">in 7 großen Dateien</span></div><div class="s" style="margin-top:6px">Nur Dateien mit bekannter Größe ab 100 MB. Kein Versprechen über freiwerdenden Speicher.</div></div>
<div class="card" style="margin-top:10px;padding:8px 14px;display:flex;justify-content:space-between;align-items:center"><span>Filter: ab 100 MB</span><span class="glass" style="border-radius:10px;padding:4px 12px">−  ＋</span></div>
<div class="seg" style="margin:10px 0"><div class="on">Größte</div><div>Neueste</div><div>Älteste</div></div>
<div class="list-h">Bekannte Größe</div>
<div class="card" style="padding:4px 12px">${[['img2','Video','14.07.2024','2,4 GB'],['img4','Video','03.06.2024','1,8 GB'],['','Beach Photos.zip','12.07.2024','1,2 GB'],['img3','Video','22.04.2024','742 MB']].map(r=>`<div class="row"><div class="thumb ${r[0]}" style="${r[0]?'':'background:#e8eef6;display:flex;align-items:center;justify-content:center'}">${r[0]?'':'▤'}</div><div><div class="t" style="font-size:15px">${r[1]}</div><div class="s">${r[2]}</div></div><div class="v">${r[3]}</div></div>`).join('<div class="divider"></div>')}</div>
<div class="list-h">Größe unbekannt (12)</div>
<div class="foot">Z. B. Videos, die nur in iCloud liegen. PhotoMaid lädt sie nicht herunter.</div>
<div class="ex" style="margin-top:8px">Beispieldaten</div>`);

/* 9 Duplikate */
phone(9,'Duplikate','DuplicatesView',`
${toolbar('Duplikate','','‹',' ')}
<div class="card" style="margin-top:10px"><div class="row"><div class="ico" style="background:#5856D61f;color:#5856D6;font-size:22px">❐</div><div><div class="t">Exakte Duplikate finden <span style="font-size:11px;background:#FF950033;border-radius:8px;padding:1px 6px">Pro</span></div><div class="s">Byte-identische Dateien per SHA-256, auf deinem Gerät. Gleiche Vorschaubilder allein gelten nicht als Duplikat.</div></div></div></div>
<div class="btn glass" style="margin-top:10px">Erneut prüfen</div>
${[['3 identische Dateien · 42 MB gesamt',['img6','img6','img6'],'2 Kopien vormerken','Zusätzliche Kopien: höchstens 28 MB ausgewählt. Keine garantierte Speicherersparnis.'],['2 identische Dateien · 120 MB gesamt',['img1','img1'],'1 Kopien vormerken','Zusätzliche Kopien: höchstens 60 MB ausgewählt.']].map(g=>`<div class="list-h" style="text-transform:none">${g[0]}</div><div class="card"><div style="display:flex;gap:8px">${g[1].map((c,i)=>`<div class="${c}" style="width:88px;height:88px;border-radius:10px;position:relative"><span style="position:absolute;right:4px;bottom:2px;font-size:20px;color:${i===0?'var(--green)':'var(--red)'}">${i===0?'✔︎':'🗑'}</span></div>`).join('')}</div><div style="color:var(--blue);font-weight:500;margin-top:10px">${g[2]}</div></div><div class="foot">${g[3]}</div>`).join('')}
<div class="ex" style="margin-top:8px">Beispieldaten</div>`);
